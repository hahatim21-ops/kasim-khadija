<body>
  <div id="backdrop" class="backdrop" aria-hidden="true"></div>

  <main>
    <h1 class="sr-only">Kasim &amp; Khadija — invitation to the Nikah &amp; Reception</h1>
    <section id="book" class="book" aria-label="Invitation book"></section>
  </main>

  <div id="curtain" class="curtain"></div>

  <div class="ui">
    <canvas class="sparkles" aria-hidden="true"></canvas>
    <nav class="dots" aria-label="Pages"></nav>
    <div class="scroll-hint ui-caps" aria-hidden="true">
      <p>Scroll to open the book</p>
      <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <button class="mute" type="button" aria-label="Mute music" aria-pressed="false" hidden>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      <svg class="note" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18.5V6.2l10-2.2v12.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="6.6" cy="18.6" rx="2.6" ry="2.1" fill="currentColor"/><ellipse cx="16.6" cy="16.4" rx="2.6" ry="2.1" fill="currentColor"/></svg>
      <span class="mute-label ui-caps" aria-hidden="true">Tap for music</span>
    </button>
  </div>

  <div id="loader" class="loader" role="status">
    <div class="loader-ring" aria-hidden="true">
      <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i>
      <i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i>
      <i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i>
    </div>
    <p class="loader-names" aria-hidden="true">Kasim &amp; Khadija</p>
    <div class="loader-line" aria-hidden="true"><span></span></div>
    <span class="sr-only">Loading the invitation…</span>
  </div>

  <div class="rotate-note" aria-live="polite">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 18.5h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <p class="ui-caps">Please rotate your phone</p>
  </div>

  <noscript><p style="position:fixed;inset:auto 0 24px;text-align:center;z-index:300">Please enable JavaScript to open the invitation.</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
